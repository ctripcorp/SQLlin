name: Build & Publish

on:
  workflow_dispatch:

env:
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

jobs:

  build-on-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native's compiler and the dependencies it downloads, which only change with the Kotlin version: keyed by
      # it, rather than by the build scripts, whose every change stored another copy of hundreds of megabytes. Without
      # restore-keys, so that a new version doesn't keep the files of the one before
      - name: Read the Kotlin version
        id: kotlin
        shell: bash
        run: |
          # Without the CR of the lines that a checkout on Windows ends with CRLF
          version=$(tr -d '\r' < gradle/libs.versions.toml | sed -n 's/^kotlin = "\(.*\)"$/\1/p')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ steps.kotlin.outputs.version }}

      - name: Build sqllin-driver
        run: ./gradlew :sqllin-driver:assemble

      - name: Build sqllin-processor
        run: ./gradlew :sqllin-processor:assemble

      - name: Build sqllin-dsl
        run: ./gradlew :sqllin-dsl:assemble

      - name: Build sqllin-dsl-paging
        run: ./gradlew :sqllin-dsl-paging:assemble

      - name: Publish to MavenCentral
        run: ./publish_all.sh
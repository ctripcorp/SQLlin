name: Build & Test

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:

  build-on-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
    
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Build sqllin-driver
        run: ./gradlew :sqllin-driver:assemble -PonCICD
        
      - name: Run sqllin-driver macOS Arm64 Tests
        run: ./gradlew :sqllin-driver:cleanMacosArm64Test :sqllin-driver:macosArm64Test --stacktrace

      - name: Run sqllin-driver JVM Unit Tests on macOS Arm64
        run: ./gradlew :sqllin-driver:cleanJvmTest :sqllin-driver:jvmTest --stacktrace

      - name: Build sqllin-dsl
        run: ./gradlew :sqllin-dsl:assemble -PonCICD

      - name: Build sqllin-dsl-paging
        run: ./gradlew :sqllin-dsl-paging:assemble -PonCICD

      - name: Run sqllin-dsl macOS Arm64 Tests
        run: ./gradlew :sqllin-dsl-test:cleanMacosArm64Test :sqllin-dsl-test:macosArm64Test --stacktrace

      - name: Run sqllin-dsl JVM Unit Tests on macOS Arm64
        run: ./gradlew :sqllin-dsl-test:cleanJvmTest :sqllin-dsl-test:jvmTest --stacktrace

      - name: Upload sqllin-driver Reports
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports-macOS-driver
          path: sqllin-driver/build/reports
        if: failure()

      - name: Upload sqllin-dsl Reports
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports-macOS-dsl
          path: sqllin-dsl-test/build/reports
        if: failure()

  build-on-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SQLite
        uses: ./.github/actions/sqlite
        with:
          version: 3.51.1
          target: windows

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Build sqllin-driver
        run: ./gradlew :sqllin-driver:mingwX64MainKlibrary :sqllin-driver:jvmJar

      - name: Run sqllin-driver MinGW X64 Tests
        run: ./gradlew :sqllin-driver:cleanMingwX64Test && ./gradlew :sqllin-driver:mingwX64Test --stacktrace

      - name: Run sqllin-driver JVM Unit Tests on MinGW X64
        run: ./gradlew :sqllin-driver:cleanJvmTest && ./gradlew :sqllin-driver:jvmTest --stacktrace

      - name: Build sqllin-dsl
        run: ./gradlew :sqllin-dsl:mingwX64MainKlibrary :sqllin-dsl:jvmJar

      - name: Build sqllin-dsl-paging
        run: ./gradlew :sqllin-dsl-paging:mingwX64MainKlibrary :sqllin-dsl-paging:jvmJar

      - name: Run sqllin-dsl MinGW X64 Tests
        run: ./gradlew :sqllin-dsl-test:cleanMingwX64Test && ./gradlew :sqllin-dsl-test:mingwX64Test --stacktrace

      - name: Run sqllin-dsl JVM Unit Tests on MinGW X64
        run: ./gradlew :sqllin-dsl-test:cleanJvmTest && ./gradlew :sqllin-dsl-test:jvmTest --stacktrace

      - name: Upload sqllin-driver Reports
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports-Windows-driver
          path: sqllin-driver/build/reports
        if: failure()

      - name: Upload sqllin-dsl Reports
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports-Windows-dsl
          path: sqllin-dsl-test/build/reports
        if: failure()

  build-on-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SQLite
        uses: ./.github/actions/sqlite
        with:
          version: 3.51.1
          target: linux

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Build sqllin-driver
        run: ./gradlew :sqllin-driver:linuxX64MainKlibrary :sqllin-driver:jvmJar

      - name: Run sqllin-driver Linux X64 Tests
        run: ./gradlew :sqllin-driver:cleanLinuxX64Test :sqllin-driver:linuxX64Test --stacktrace

      - name: Run sqllin-driver JVM Unit Tests on Linux X64
        run: ./gradlew :sqllin-driver:cleanJvmTest :sqllin-driver:jvmTest --stacktrace

      - name: Build sqllin-processor
        run: ./gradlew :sqllin-processor:assemble

      - name: Build sqllin-dsl
        run: ./gradlew :sqllin-dsl:linuxX64MainKlibrary :sqllin-dsl:jvmJar

      - name: Build sqllin-dsl-paging
        run: ./gradlew :sqllin-dsl-paging:linuxX64MainKlibrary :sqllin-dsl-paging:jvmJar

      - name: Run sqllin-dsl Linux X64 Tests
        run: ./gradlew :sqllin-dsl-test:cleanLinuxX64Test :sqllin-dsl-test:linuxX64Test --stacktrace

      - name: Run sqllin-dsl JVM Unit Tests on Linux X64
        run: ./gradlew :sqllin-dsl-test:cleanJvmTest :sqllin-dsl-test:jvmTest --stacktrace

      - name: Upload sqllin-driver Reports
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports-Linux-driver
          path: sqllin-driver/build/reports
        if: failure()

      - name: Upload sqllin-dsl Reports
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports-Linux-dsl
          path: sqllin-dsl-test/build/reports
        if: failure()

  # The native tests on Linux again, linking the SQLite versions of the Android API levels that no other job runs:
  # Robolectric's SQLite is 3.32.2 at its lowest. They tell what those versions of SQLite take, not what Android's
  # build of them or its framework does.
  test-on-older-sqlite:
    name: test-on-sqlite-${{ matrix.sqlite }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Android API 24 and 25, 26, 28 and 29, and 30
        sqlite: [ '3.9.2', '3.18.2', '3.22.0', '3.28.0' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SQLite
        uses: ./.github/actions/sqlite
        with:
          version: ${{ matrix.sqlite }}
          target: linux

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run sqllin-driver Linux X64 Tests on SQLite ${{ matrix.sqlite }}
        run: ./gradlew :sqllin-driver:cleanLinuxX64Test :sqllin-driver:linuxX64Test --stacktrace

      - name: Run sqllin-dsl Linux X64 Tests on SQLite ${{ matrix.sqlite }}
        run: ./gradlew :sqllin-dsl-test:cleanLinuxX64Test :sqllin-dsl-test:linuxX64Test --stacktrace

      # The library holds its version as a string, and no test has that string
      - name: Check that the tests linked SQLite ${{ matrix.sqlite }}
        run: strings -a sqllin-dsl-test/build/bin/linuxX64/debugTest/test.kexe | grep -Fx '${{ matrix.sqlite }}'

      - name: Upload sqllin-driver Reports
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports-SQLite-${{ matrix.sqlite }}-driver
          path: sqllin-driver/build/reports
        if: failure()

      - name: Upload sqllin-dsl Reports
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports-SQLite-${{ matrix.sqlite }}-dsl
          path: sqllin-dsl-test/build/reports
        if: failure()

  build-android-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android
        run: ./gradlew :sqllin-driver:assembleAndroidMain :sqllin-dsl:assembleAndroidMain :sqllin-dsl-paging:assembleAndroidMain

      - name: Cache Robolectric Android-All Jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-

      - name: Run sqllin-driver Android Unit Tests
        run: ./gradlew :sqllin-driver:testAndroidHostTest --stacktrace

      - name: Run sqllin-dsl Android Unit Tests
        run: ./gradlew :sqllin-dsl-test:testAndroidHostTest --stacktrace

      - name: Upload sqllin-driver Reports
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports-Android-driver
          path: sqllin-driver/build/reports
        if: failure()

      - name: Upload sqllin-dsl Reports
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports-Android-dsl
          path: sqllin-dsl-test/build/reports
        if: failure()

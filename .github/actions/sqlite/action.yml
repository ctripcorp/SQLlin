name: SQLite library
description: >-
  Provides the static SQLite library that the native tests link on Linux and Windows, libs/<target>/libsqlite3.a,
  which isn't in the repository: from the cache, or built from the sources of the version with scripts/build-sqlite.sh

inputs:
  version:
    description: The SQLite version, one that scripts/build-sqlite.sh lists
    required: true
  target:
    description: linux or windows
    required: true

runs:
  using: composite
  steps:
    # A version's library never changes unless how it is built does, so it is almost always here
    - name: Restore SQLite ${{ inputs.version }} from the cache
      id: cache
      uses: actions/cache@v4
      with:
        path: libs/${{ inputs.target }}/libsqlite3.a
        key: sqlite-${{ inputs.target }}-${{ inputs.version }}-${{ hashFiles('scripts/build-sqlite.sh', '.github/actions/sqlite/action.yml') }}

    # zig comes from PyPI, which needs a Python that pip may install into, as that of Ubuntu isn't
    - name: Set up Python
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Build SQLite ${{ inputs.version }}
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ZIG_VERSION: 0.16.0
        ZIG: python -m ziglang
        SQLITE_VERSION: ${{ inputs.version }}
        SQLITE_TARGET: ${{ inputs.target }}
      run: |
        python -m pip install --quiet "ziglang==$ZIG_VERSION"
        bash scripts/build-sqlite.sh "$SQLITE_VERSION" "$SQLITE_TARGET"

    - name: Show the SQLite library
      shell: bash
      env:
        SQLITE_TARGET: ${{ inputs.target }}
      run: |
        ls -l "libs/$SQLITE_TARGET/libsqlite3.a"
        if command -v sha256sum > /dev/null 2>&1; then sha256sum "libs/$SQLITE_TARGET/libsqlite3.a"; else shasum -a 256 "libs/$SQLITE_TARGET/libsqlite3.a"; fi
